<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Media Downloader+ Connector</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <main>
      <header>
        <!-- The application's six-blade aperture, halved from the 48-unit box
             src/components/layout/Logo.tsx draws it in. -->
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <mask id="welcomeMarkMask">
              <rect width="24" height="24" fill="black" />
              <circle cx="12" cy="12" r="10" fill="white" />
              <path d="M12 5.3 17.8 8.65 17.8 15.35 12 18.7 6.2 15.35 6.2 8.65Z" fill="black" />
              <g stroke="black" stroke-width="1.7" stroke-linecap="round">
                <path d="M12 5.3 25 12.8" />
                <path d="M17.8 8.65 17.8 23.65" />
                <path d="M17.8 15.35 4.8 22.85" />
                <path d="M12 18.7 -1 11.2" />
                <path d="M6.2 15.35 6.2 0.35" />
                <path d="M6.2 8.65 19.2 1.15" />
              </g>
            </mask>
          </defs>
          <circle cx="12" cy="12" r="10" fill="currentColor" mask="url(#welcomeMarkMask)" />
        </svg>
        <h1 data-i18n="welcomeTitle"></h1>
      </header>

      <!-- One step at a time, the first shown without script: welcome.js
           hides the rest and adds the buttons. -->
      <div class="tour" aria-live="polite">
        <section class="step" data-step>
          <h2 data-i18n="tourIntroTitle"></h2>
          <p data-i18n="tourIntroBody"></p>
        </section>
        <section class="step" data-step>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4.75 6H7v-.5a2.5 2.5 0 0 1 5 0V6h2.25A1.25 1.25 0 0 1 15.5 7.25V9.5h.5a2.5 2.5 0 0 1 0 5h-.5v2.25A1.25 1.25 0 0 1 14.25 18H4.75A1.25 1.25 0 0 1 3.5 16.75V7.25A1.25 1.25 0 0 1 4.75 6Z"
              fill="currentColor"
            />
          </svg>
          <h2 data-i18n="pinTitle"></h2>
          <p data-i18n="pinBody"></p>
        </section>
        <section class="step" data-step>
          <h2 data-i18n="step1Title"></h2>
          <p data-i18n="step1Body"></p>
        </section>
        <section class="step" data-step>
          <h2 data-i18n="step2Title"></h2>
          <p data-i18n="step2Body"></p>
        </section>
        <section class="step" data-step>
          <h2 data-i18n="step3Title"></h2>
          <p data-i18n="step3Body"></p>
        </section>
        <section class="step" data-step>
          <h2 data-i18n="tourMenuTitle"></h2>
          <p data-i18n="tourMenuBody"></p>
        </section>
        <section class="step" data-step>
          <h2 data-i18n="tourPickTitle"></h2>
          <p data-i18n="tourPickBody"></p>
        </section>
        <!-- full -->
        <section class="step" data-step>
          <h2 data-i18n="sessionsTitle"></h2>
          <p data-i18n="welcomeSession"></p>
        </section>
        <!-- /full -->
        <section class="step" data-step>
          <h2 data-i18n="tourDoneTitle"></h2>
          <p data-i18n="privacyBody"></p>
        </section>
      </div>

      <nav class="controls" hidden>
        <span class="progress" id="progress"></span>
        <span class="dots" id="dots" aria-hidden="true"></span>
        <button type="button" class="ghost" id="skip" data-i18n="tourSkip"></button>
        <button type="button" class="ghost" id="back" data-i18n="tourBack"></button>
        <button type="button" class="primary" id="next"></button>
      </nav>
    </main>

    <script src="i18n.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
